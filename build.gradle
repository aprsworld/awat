buildscript {
	repositories {
		google()
		mavenCentral()
		//jcenter()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.9.1'
	}
}

repositories {
	google()
	mavenCentral()
	//jcenter()
}

apply plugin : 'com.android.application'
android {
	dependencies {
		def acraVersion = '5.4.0'
		implementation "ch.acra:acra-core:$acraVersion"
		implementation "ch.acra:acra-mail:$acraVersion"
		implementation "ch.acra:acra-limiter:$acraVersion"
		implementation 'com.android.support:support-vector-drawable:28.0.0'
	}

	namespace 'com.aprsworld.awat'
	buildFeatures {
			buildConfig true
	}

	def getGitHash = { ->
		return providers.exec {
			commandLine 'git', 'rev-parse', 'HEAD'
		}.getStandardOutput().getAsText().get().trim()
	}

	def getGitClean = { ->
		return !providers.exec {
			commandLine 'git', 'diff', '--quiet'
			ignoreExitValue = true
		}.standardError  // .getExitValue() == 0
	}

	defaultConfig {
		applicationId 'com.aprsworld.awat'
	//  minSdkVersion 28
		//minSdkVersion 16
		minSdkVersion 21
		//targetSdkVersion 31
		targetSdk 21 // 34
		compileSdk 34
		versionCode 2000
		versionName '2.0'
		//testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
		buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + System.currentTimeMillis() + "L)"
		buildConfigField "String", "BUILD_GIT_HASH", "\"${getGitHash()}\""
		//buildConfigField "String", "BUILD_GIT_HASH", "\"undefined\""
		buildConfigField "boolean", "BUILD_GIT_CLEAN", "${getGitClean()}"
		//buildConfigField "boolean", "BUILD_GIT_CLEAN", "false"
		vectorDrawables.useSupportLibrary true
	}

	buildTypes {
		debug {
			minifyEnabled false
		}
		release {
			minifyEnabled true
//			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			lint {
				abortOnError true
			}
		}
	}
	dependenciesInfo {
		includeInApk true
		includeInBundle true
	}
